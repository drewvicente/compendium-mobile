<ion-content [fullscreen]="true" class="login-content">
  <div class="login-wrap">
    <div class="brand">
      <div class="brand-mark">
        <ion-icon name="school-outline"></ion-icon>
      </div>
      <p class="section-eyebrow">The Compendium</p>
      <h1>Your research,<span> published.</span></h1>
      <p class="sub">Sign in with your LRN to submit and track your manuscripts.</p>
    </div>

    <form class="login-form" #f="ngForm">
      <div class="field">
        <label for="lrn">Learner Reference Number (LRN)</label>
        <ion-input
          id="lrn"
          name="lrn"
          type="text"
          inputmode="numeric"
          placeholder="100000000001"
          fill="outline"
          [(ngModel)]="lrn"
          required
        >
          <ion-icon name="person-outline" slot="start"></ion-icon>
        </ion-input>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <ion-input
          id="password"
          name="password"
          type="password"
          placeholder="••••••••"
          fill="outline"
          [(ngModel)]="password"
          required
          (keyup.enter)="submit()"
        >
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        </ion-input>
      </div>

      @if (error()) {
        <div class="error-banner" role="alert">{{ error() }}</div>
      }

      <ion-button
        type="button"
        expand="block"
        shape="round"
        class="submit-btn"
        [disabled]="loading()"
        (click)="submit()"
      >
        @if (loading()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Sign In
          <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
        }
      </ion-button>
    </form>

    <button type="button" class="demo-hint" (click)="fillDemoCredentials()">
      <ion-icon name="information-circle-outline"></ion-icon>
      <span>Demo build — tap to autofill sample credentials</span>
    </button>
  </div>
</ion-content>
